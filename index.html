    // ===== 内嵌 SVG 图片生成器（替代失效的字节CDN图片） =====
    function cardImg(id, name, rarity) {
      const palettes = {
        rare:      { bg: '#E9F5F2', fg: '#4A9D8F', accent: '#2C7A6F', dot: '#34D399', pattern: 'wave' },
        epic:      { bg: '#F2E9F0', fg: '#9333EA', accent: '#7C3AED', dot: '#A78BFA', pattern: 'diamond' },
        legendary: { bg: '#FEF3C7', fg: '#D97706', accent: '#B45309', dot: '#FBBF24', pattern: 'star' }
      };
      const p = palettes[rarity] || palettes.rare;
      const hash = id.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
      const h = hash % 360;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560">
        <defs>
          <linearGradient id="g${id}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:${p.bg};stop-opacity:1"/>
            <stop offset="100%" style="stop-color:${p.fg};stop-opacity:0.3"/>
          </linearGradient>
          <filter id="noise${id}"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise"/><feColorMatrix type="saturate" values="0" in="noise" result="gray"/><feBlend in="SourceGraphic" in2="gray" mode="multiply"/></filter>
        </defs>
        <rect width="400" height="560" rx="24" fill="url(#g${id})"/>
        <!-- 水墨晕染效果 -->
        <circle cx="${100 + (hash%200)}" cy="${150 + (hash%200)}" r="${80 + (hash%80)}" fill="${p.fg}" opacity="0.08"/>
        <circle cx="${250 - (hash%100)}" cy="${350 - (hash%100)}" r="${60 + ((hash*3)%80)}" fill="${p.dot}" opacity="0.06"/>
        <!-- 装饰线条 -->
        <line x1="40" y1="${300 + (hash%100)}" x2="360" y2="${280 + ((hash*2)%120)}" stroke="${p.fg}" stroke-width="0.5" opacity="0.15"/>
        <line x1="40" y1="${320 + (hash%80)}" x2="360" y2="${300 + ((hash*3)%100)}" stroke="${p.accent}" stroke-width="0.3" opacity="0.1"/>
        <!-- 主图：圆形墨韵 -->
        <circle cx="200" cy="220" r="90" fill="none" stroke="${p.fg}" stroke-width="2" opacity="0.25"/>
        <circle cx="200" cy="220" r="75" fill="${p.fg}" opacity="0.12"/>
        <circle cx="200" cy="220" r="55" fill="${p.fg}" opacity="0.18"/>
        <!-- 中心符号 -->
        <text x="200" y="232" text-anchor="middle" font-family="serif" font-size="48" fill="${p.accent}" opacity="0.6">${name.charAt(0)}</text>
        <!-- 底部文字 -->
        <rect x="40" y="440" width="320" height="80" rx="12" fill="white" opacity="0.85"/>
        <text x="200" y="478" text-anchor="middle" font-family="sans-serif" font-size="22" fill="${p.accent}" font-weight="bold">${name}</text>
        <text x="200" y="505" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#999">#${id}</text>
        <!-- 稀有度标记 -->
        <circle cx="360" cy="40" r="16" fill="${p.fg}" opacity="0.2"/>
        <circle cx="360" cy="40" r="8" fill="${p.accent}"/>
      </svg>`;
      return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    }

          <text x="300" y="290" text-anchor="middle" font-family="sans-serif" font-size="20" fill="white" opacity="0.7">法尔如是 · 不期而遇</text>

            {id:'ink-004',name:'歌舞法活动讨论4',image:'images/card-04.png',rarity:'epic',description:'会议纪要：歌舞法活动事宜讨论',probability:0.1},
            {id:'ink-005',name:'彩色舞者',image:'images/card-05.png',rarity:'legendary',description:'彩色水墨风格的舞者形象',probability:0.05},
            {id:'ink-006',name:'青暖墨韵1',image:'images/card-06.png',rarity:'rare',description:'青暖墨韵限定盲盒',probability:0.15},
            {id:'ink-007',name:'青暖墨韵2',image:'images/card-07.png',rarity:'epic',description:'青暖墨韵限定盲盒',probability:0.1},

      rarityConfig: {
        rare:{name:'稀有',color:'bg-primary',glow:'rarity-glow-rare',bg:'bg-rare-bg'},
        epic:{name:'史诗',color:'bg-purple-500',glow:'rarity-glow-epic',bg:'bg-epic-bg'},
        legendary:{name:'传奇',color:'bg-yellow-500',glow:'rarity-glow-legendary',bg:'bg-legendary-bg'}
      }
    };

    const elements = {
      nicknameInput:document.getElementById('nicknameInput'),
      cardNickInput:document.getElementById('cardNickInput'),
      winModal:document.getElementById('winModal'),
      winText:document.getElementById('winText'),
      closeWinBtn:document.getElementById('closeWinBtn'),
      backToHomeBtn:document.getElementById('backToHomeBtn'),
      blindBoxSection:document.getElementById('blindBoxSection'),
      drawSection:document.getElementById('drawSection'),
      collectionSection:document.getElementById('collectionSection'),
      collectionBtn:document.getElementById('collectionBtn'),
      backFromCollectionBtn:document.getElementById('backFromCollectionBtn'),
      backToBoxesBtn:document.getElementById('backToBoxesBtn'),
      drawBtn:document.getElementById('drawBtn'),
      blindBoxContainer:document.getElementById('blindBoxContainer'),
      cardRevealContainer:document.getElementById('cardRevealContainer'),
      cardElement:document.getElementById('cardElement'),
      cardFront:document.getElementById('cardFront'),
      cardBack:document.getElementById('cardBack'),
      blindBoxImage:document.getElementById('blindBoxImage'),
      collectionGrid:document.getElementById('collectionGrid'),
      cardDetailModal:document.getElementById('cardDetailModal'),
      closeDetailBtn:document.getElementById('closeDetailBtn'),
      modalCardImage:document.getElementById('modalCardImage'),
      modalCardRarity:document.getElementById('modalCardRarity'),
      modalCardSeries:document.getElementById('modalCardSeries'),
      modalCardDate:document.getElementById('modalCardDate'),
      modalCardId:document.getElementById('modalCardId')
    };

    function initApp(){
      loadData();bindEvents();
      // Logo 和卡背用内嵌 SVG（没有对应的真实图片）
      document.getElementById('logoImg').src = logoImg();
      document.getElementById('cardBack').src = cardBackImg();
      // 顶部昵称和卡片里的昵称双向同步
      elements.nicknameInput.value = appData.nickname;
      elements.cardNickInput.value = appData.nickname;
    }
    function loadData(){
      const c=localStorage.getItem('blindBoxCollection'),u=localStorage.getItem('blindBoxCustomCards');
      if(c)appData.collection=JSON.parse(c);if(u)appData.customCards=JSON.parse(u);
    }
    function saveData(){
      localStorage.setItem('blindBoxCollection',JSON.stringify(appData.collection));
      localStorage.setItem('blindBoxCustomCards',JSON.stringify(appData.customCards));
      localStorage.setItem('blindbox_nickname',appData.nickname);
    }
    function backToHomeFromWinModal(){elements.winModal.classList.add('hidden');showBlindBoxSection();}
    function bindEvents(){
      // 双向同步昵称
      elements.nicknameInput.addEventListener('input',()=>{
        appData.nickname=elements.nicknameInput.value.trim();
        elements.cardNickInput.value = appData.nickname;
        saveData();
      });
      elements.cardNickInput.addEventListener('input',()=>{
        appData.nickname=elements.cardNickInput.value.trim();
        elements.nicknameInput.value = appData.nickname;
        saveData();
      });

      elements.closeWinBtn.addEventListener('click',()=>elements.winModal.classList.add('hidden'));
      elements.backToHomeBtn.addEventListener('click',backToHomeFromWinModal);
      elements.collectionBtn.addEventListener('click',showCollectionSection);
      elements.backFromCollectionBtn.addEventListener('click',showBlindBoxSection);
      elements.backToBoxesBtn.addEventListener('click',showBlindBoxSection);
      document.querySelectorAll('.blind-box-btn').forEach(b=>b.addEventListener('click',()=>selectBlindBox(b.dataset.series)));
      elements.drawBtn.addEventListener('click',drawCard);
      document.querySelectorAll('.collection-filter').forEach(b=>{
        b.addEventListener('click',()=>{
          document.querySelectorAll('.collection-filter').forEach(x=>{x.classList.remove('bg-primary','text-white');x.classList.add('bg-gray-200','text-gray-700');});
          b.classList.remove('bg-gray-200','text-gray-700');b.classList.add('bg-primary','text-white');
          filterCollection(b.dataset.filter);
        });
      });
      elements.cardDetailModal.addEventListener('click',e=>{if(e.target===elements.cardDetailModal)elements.cardDetailModal.classList.add('hidden');});
      elements.closeDetailBtn.addEventListener('click',()=>elements.cardDetailModal.classList.add('hidden'));
    }
    function showBlindBoxSection(){elements.blindBoxSection.classList.remove('hidden');elements.drawSection.classList.add('hidden');elements.collectionSection.classList.add('hidden');}
    function showDrawSection(){
      elements.blindBoxSection.classList.add('hidden');elements.drawSection.classList.remove('hidden');elements.collectionSection.classList.add('hidden');
      elements.cardRevealContainer.classList.add('hidden');elements.blindBoxContainer.classList.remove('hidden');
      elements.drawBtn.textContent='开始抽取';elements.drawBtn.disabled=false;
    }
    function showCollectionSection(){elements.blindBoxSection.classList.add('hidden');elements.drawSection.classList.add('hidden');elements.collectionSection.classList.remove('hidden');renderCollection();}
    function selectBlindBox(s){appData.currentSeries=s;showDrawSection();}
    function drawCard(){
      const n=elements.nicknameInput.value.trim();if(!n){alert('请先输入昵称！');return;}
      appData.nickname=n;saveData();
      elements.drawBtn.disabled=true;elements.drawBtn.textContent='抽取中...';
      const card=selectRandomCard(appData.cardSeries[appData.currentSeries].cards);
      const item={...card,acquiredDate:new Date().toISOString(),series:appData.currentSeries};
      appData.collection.push(item);saveData();performDrawAnimation(item);
    }
    function selectRandomCard(arr){
      let r=Math.random(),s=0;
      for(let i of arr){s+=i.probability||1/arr.length;if(r<=s)return i;}
      return arr[arr.length-1];
    }
    function createParticleEffect(t){
      const r=t.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
      for(let i=0;i<20;i++){
        const p=document.createElement('div');p.className='absolute w-2 h-2 bg-primary rounded-full';
        p.style.left=x+'px';p.style.top=y+'px';p.style.position='fixed';p.style.zIndex='1000';
        document.body.appendChild(p);
        const a=(i/20)*Math.PI*2,d=50+Math.random()*50,du=500+Math.random()*500;
        p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`,opacity:0}],{duration:du,easing:'ease-out'}).onfinish=()=>p.remove();
      }
    }
    function performDrawAnimation(card){
      elements.blindBoxContainer.classList.add('animate-shake');createParticleEffect(elements.blindBoxContainer);
      setTimeout(()=>{
        elements.blindBoxContainer.classList.add('hidden');elements.cardRevealContainer.classList.remove('hidden');
        elements.cardElement.style.transform='rotateY(0deg) scale(0.8)';elements.cardFront.src=card.image;
        setTimeout(()=>{
          elements.cardElement.style.transform='rotateY(180deg) scale(1)';
          setTimeout(()=>{
            const cfg=appData.rarityConfig[card.rarity];
            if(cfg){elements.cardFront.parentElement.classList.add(cfg.glow);elements.cardFront.parentElement.style.border=`3px solid ${getComputedStyle(document.querySelector('.'+cfg.color)).backgroundColor}`;}
            setTimeout(()=>{
              elements.drawBtn.textContent='再次抽取';elements.drawBtn.disabled=false;
              elements.winText.innerText=`恭喜”${appData.nickname}”首月通关`;
              elements.winModal.classList.remove('hidden');showCardDetailModal(card);
            },800);
          },600);
        },300);
      },1200);
    }
    function showCardDetailModal(card){
      const cfg=appData.rarityConfig[card.rarity];
      elements.modalCardImage.src=card.image;
      elements.modalCardRarity.textContent=cfg.name;
      elements.modalCardRarity.className=`px-2 py-1 rounded-full text-white text-xs font-medium shadow-lg ${cfg.color}`;
      elements.modalCardSeries.textContent=appData.cardSeries[card.series].name;
      const d=new Date(card.acquiredDate);
      elements.modalCardDate.textContent=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      elements.modalCardId.textContent=card.id;
      elements.cardDetailModal.classList.remove('hidden');
    }
    function renderCollection(filter='all'){
      const g=elements.collectionGrid;g.innerHTML='';
      const map={};appData.collection.forEach(c=>{if(!map[c.id]||new Date(c.acquiredDate)>new Date(map[c.id].acquiredDate))map[c.id]=c;});
      let list=Object.values(map);if(filter!=='all')list=list.filter(x=>x.rarity===filter);
      if(!list.length){g.innerHTML=`<div class="text-center col-span-full py-8 text-gray-500"><i class="fa fa-book text-4xl mb-2"></i><p>没有找到符合条件的卡片</p></div>`;return;}
      list.forEach(c=>{
        const cfg=appData.rarityConfig[c.rarity];
        const div=document.createElement('div');
        div.className=`bg-white rounded-lg overflow-hidden card-shadow card-hover ${cfg.bg}`;
        div.innerHTML=`<div class="relative"><img src="${c.image}" class="w-full h-56 object-cover"><div class="absolute top-1 right-1 px-1.5 py-0.5 rounded-full text-white text-xs ${cfg.color}">${cfg.name}</div></div><div class="p-2"><h4 class="text-sm font-medium truncate">${c.name}</h4><p class="text-xs text-gray-500">${appData.cardSeries[c.series].name}</p></div>`;
        div.onclick=()=>showCardDetailModal(c);g.appendChild(div);
      });
    }
    function filterCollection(f){renderCollection(f);}
    document.addEventListener('DOMContentLoaded',initApp);
  </script>
</body></html>
